<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Shopping App</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#f5f5f5; }
    header { background:#007bff; color:white; padding:15px; display:flex; justify-content:space-between; align-items:center; }
    header h1 { margin:0; }
    .cart { font-size:18px; }
    .container { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:20px; padding:20px; }
    .product { background:white; padding:15px; border-radius:12px; text-align:center; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
    .product img { width:100%; max-height:150px; object-fit:cover; border-radius:8px; }
    .product h3 { margin:10px 0; font-size:18px; }
    .product p { color:#555; }
    .product button { background:#007bff; color:white; border:none; padding:10px; margin-top:10px; width:100%; border-radius:8px; cursor:pointer; }
    .product button:hover { background:#0056b3; }
    #cartBox { background:white; padding:15px; margin:20px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
    #cartItems { list-style:none; padding:0; }
    #cartItems li { margin:8px 0; }
  </style>
</head>
<body>
  <header>
    <h1>🛒 Online Shop</h1>
    <div class="cart">Cart: <span id="cartCount">0</span> items | ₹<span id="cartTotal">0</span></div>
  </header>

  <div class="container" id="productList">
    <!-- Products will be inserted here by JS -->
  </div>

  <div id="cartBox">
    <h2>My Cart</h2>
    <ul id="cartItems"></ul>
    <p><strong>Total: ₹<span id="cartTotal2">0</span></strong></p>
  </div>

  <script>
    // Product data
    const products = [
      { id:1, name:"Smartphone", price:15000, img:"https://via.placeholder.com/200x150?text=Phone" },
      { id:2, name:"Laptop", price:55000, img:"https://via.placeholder.com/200x150?text=Laptop" },
      { id:3, name:"Headphones", price:2000, img:"https://via.placeholder.com/200x150?text=Headphones" },
      { id:4, name:"Shoes", price:2500, img:"https://via.placeholder.com/200x150?text=Shoes" },
      { id:5, name:"Watch", price:3000, img:"https://via.placeholder.com/200x150?text=Watch" }
    ];

    let cart = [];

    // Render products
    const productList = document.getElementById("productList");
    products.forEach(p => {
      const div = document.createElement("div");
      div.className = "product";
      div.innerHTML = `
        <img src="${p.img}" alt="${p.name}">
        <h3>${p.name}</h3>
        <p>₹${p.price}</p>
        <button onclick="addToCart(${p.id})">Add to Cart</button>
      `;
      productList.appendChild(div);
    });

    // Add to cart
    function addToCart(id) {
      const product = products.find(p => p.id === id);
      cart.push(product);
      updateCart();
    }

    // Update cart
    function updateCart() {
      document.getElementById("cartCount").textContent = cart.length;
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById("cartTotal").textContent = total;
      document.getElementById("cartTotal2").textContent = total;

      // Cart items list
      const cartItems = document.getElementById("cartItems");
      cartItems.innerHTML = "";
      cart.forEach(item => {
        const li = document.createElement("li");
        li.textContent = `${item.name} - ₹${item.price}`;
        cartItems.appendChild(li);
      });
    }
  </script>
</body>
</html>
